<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teleprompter - Roteiro</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
  
    textarea {
      width: 80%;
      height: 300px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 18px;
      resize: none;
    }
  
    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #00b894;
      color: white;
      transition: background 0.3s;
    }
  
    button:hover {
      background: #019875;
    }
  </style>
</head>
<body>
  <h1>📝 Teleprompter</h1>
  <p>Digite ou cole o seu roteiro abaixo:</p>
  
  <textarea id="roteiro" placeholder="Cole aqui o texto do seu roteiro..."></textarea>
  
  <button id="executar">Executar Teleprompter ▶</button>
  
  <script>
    document.getElementById("executar").addEventListener("click", () => {
      const texto = document.getElementById("roteiro").value.trim();
      if (texto === "") {
        alert("Por favor, insira um roteiro antes de executar.");
        return;
      }

      // Armazena o texto no localStorage
      localStorage.setItem("roteiro", texto);

      // Redireciona para o teleprompter
      window.location.href = "teleprompt.html";
    });
      </script>
</body>
</html>
