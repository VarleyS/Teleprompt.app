<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-size: clamp(1.5em, 6vw, 2em);
      padding: 0 20px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Câmera ocupa a tela toda, atrás do texto */
    #preview {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #000;
    }
    /* Câmera frontal: prévia em espelho (só na tela, o vídeo gravado não é afetado) */
    #preview.frontal {
      transform: scaleX(-1);
    }

    #app {
      position: relative;
      z-index: 1;
      /* espaço para o texto começar no meio da tela e terminar fora dela */
      padding-top: 40vh;
      padding-bottom: 90vh;
    }

    /* Fundo escuro translúcido para o texto continuar legível sobre a imagem */
    #texto {
      background: rgba(0, 0, 0, 0.55);
      padding: 12px 16px;
      border-radius: 10px;
    }

    #controles {
      position: fixed;
      z-index: 5;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: calc(100% - 24px);
      max-width: 560px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 12px;
    }

    button {
      font-size: 16px;
      background: #00b894;
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #019875; }
    button:disabled { opacity: 0.4; cursor: default; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    #gravar { background: #d63031; }
    #gravar:hover { background: #b52425; }
    #salvar { background: #0984e3; }
    #salvar:hover { background: #0770c0; }

    .espelhado { transform: scaleX(-1); }

    /* Indicador de gravação */
    #indicador {
      position: fixed;
      z-index: 5;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }
    #indicador.ativo { display: flex; }
    #indicador::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4d4d;
    }

    /* Contagem regressiva antes de gravar */
    #contagem {
      position: fixed;
      z-index: 6;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 30vw;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.5);
    }
    #contagem.ativo { display: flex; }

    /* Mensagens de status e erro */
    #status {
      position: fixed;
      z-index: 7;
      top: calc(56px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      display: none;
      background: rgba(0, 0, 0, 0.8);
      border-left: 4px solid #00b894;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1.4;
    }
    #status.ativo { display: block; }
    #status.erro { border-left-color: #ff4d4d; }
  </style>
</head>
<body>
  <video id="preview" autoplay muted playsinline></video>

  <div id="app">
    <div id="texto"></div>
  </div>

  <div id="indicador"><span id="tempo">00:00</span></div>
  <div id="contagem"></div>
  <div id="status" role="status"></div>

  <div id="controles">
    <button id="gravar">⏺ Gravar</button>
    <button id="salvar" hidden>💾 Salvar vídeo</button>
    <button id="play">▶ Play</button>
    <button id="pause">⏸ Pause</button>
    <button id="maisVelocidade">➕ Mais rápido</button>
    <button id="menosVelocidade">➖ Mais lento</button>
    <button id="espelhar">🪞 Espelhar texto</button>
    <button id="trocarCamera">🔄 Trocar câmera</button>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/teleprompter.js"></script>
  <script>
    // Carrega o roteiro salvo
    const texto = localStorage.getItem("roteiro");
    if (texto) {
      document.getElementById("texto").innerHTML = texto
        .split("\n")
        .map(p => `<p>${p}</p>`)
        .join("");
    } else {
      document.getElementById("texto").innerHTML = "<p>Nenhum texto encontrado.</p>";
    }
  </script>
</body>
</html>
